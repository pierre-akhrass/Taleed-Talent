name: Deploy Taleed Talent to GitHub Pages

on:
  workflow_dispatch:
    inputs:
      deployment_target:
        description: Confirm this is the synthetic demo only
        required: true
        type: choice
        options:
          - synthetic-demo

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: inputs.deployment_target == 'synthetic-demo'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: taleed-talent-spa
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: taleed-talent-spa/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: taleed-talent-spa/dist

  deploy:
    if: inputs.deployment_target == 'synthetic-demo'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4