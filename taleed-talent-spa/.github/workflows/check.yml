name: Prototype checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Require the reviewed dependency lockfile
        run: test -f package-lock.json || (echo "Run node scripts/bootstrap.mjs locally and commit the reviewed lockfile first." && exit 1)
      - run: npm ci
      - run: npm run check:source
      - run: npm run test:domain
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-evidence
          path: playwright-report/
