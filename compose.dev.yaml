name: talent-dev

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: talent
      MYSQL_USER: talent
      MYSQL_PASSWORD: talent-local-only
      MYSQL_ROOT_PASSWORD: root-local-only
    ports:
      - "127.0.0.1:3308:3306"
    volumes:
      - talent_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -proot-local-only"]
      interval: 5s
      timeout: 5s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.24
    ports:
      - "127.0.0.1:1027:1025"
      - "127.0.0.1:8027:8025"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    working_dir: /app
    command: sh -c "cd public && exec php -S 0.0.0.0:8000 -t . ../vendor/laravel/framework/src/Illuminate/Foundation/resources/server.php"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: https://talent.taleed.test:9443
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: talent
      DB_USERNAME: talent
      DB_PASSWORD: talent-local-only
      MAIL_MAILER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      CACHE_STORE: file
      SESSION_DRIVER: file
      QUEUE_CONNECTION: database
    depends_on:
      mysql:
        condition: service_healthy
      mailpit:
        condition: service_started
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend:/app
      - ./contracts:/contracts:ro

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    working_dir: /app
    command: php artisan queue:work --sleep=1 --tries=1 --timeout=60
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: talent
      DB_USERNAME: talent
      DB_PASSWORD: talent-local-only
      CACHE_STORE: file
      QUEUE_CONNECTION: database
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./backend:/app

  scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    working_dir: /app
    command: php artisan schedule:work
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: talent
      DB_USERNAME: talent
      DB_PASSWORD: talent-local-only
      CACHE_STORE: file
      QUEUE_CONNECTION: database
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./backend:/app

  vite:
    image: node:24.10.0-alpine@sha256:775ba24d35a13e74dedce1d2af4ad510337b68d8e22be89e0ce2ccc299329083
    working_dir: /workspace
    command: sh scripts/start-vite.sh
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./taleed-talent-spa:/workspace
      - ./contracts:/contracts:ro
      - talent_node_modules_node24:/workspace/node_modules

  caddy:
    image: caddy:2.10
    ports:
      - "127.0.0.1:9443:443"
    volumes:
      - ./infra/dev/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  talent_mysql_data:
  talent_node_modules_node24:
  caddy_data:
  caddy_config:
